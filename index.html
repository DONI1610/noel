<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas!</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="card">
        <h1>Merry Christmas!</h1>
        <p>Chúc bạn một Giáng sinh vui vẻ, ấm áp và hạnh phúc!</p>
        <div class="star"></div>

    </div>


    <!-- Tạo tuyết rơi bằng JS đơn giản -->
    <script>
        function createSnow() {
            const snow = document.createElement('div');
            snow.className = 'snowflake';
            snow.innerText = ['❄', '❅', '❆'][Math.floor(Math.random() * 3)];
            snow.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 15 + 10;
            snow.style.fontSize = size + 'px';
            const duration = Math.random() * 10 + 10;
            snow.style.animationDuration = duration + 's';
            snow.style.animation = `fall ${duration}s linear infinite`;
            snow.style.opacity = Math.random() * 0.5 + 0.5;

            document.body.appendChild(snow);
            setTimeout(() => {
                snow.remove();
            }, duration * 1000);
        }
        setInterval(createSnow, 150);
        for (let i = 0; i < 100; i++) {
            setTimeout(createSnow, i * 50);
        }
    </script>
</body>

</html>
