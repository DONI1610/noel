<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas!</title>
    <style>
        body {
    margin: 0;
    padding: 0;
    height: 100vh;

    background-image:
        linear-gradient(rgba(0, 31, 63, 0.6), rgba(7, 140, 235, 0.6)),
        url("bg.jpg");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    color: white;
}


        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        h1 {
            font-size: 50px;
            text-shadow: 0 0 10px red;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px red;
            }

            to {
                text-shadow: 0 0 30px gold;
            }
        }

        .star {
            width: 50px;
            height: 50px;
            background: yellow;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            position: absolute;
            top: -200px;
            left: 75px;
            animation: twinkle 1s infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.8;
            }

            to {
                opacity: 1;
                box-shadow: 0 0 20px gold;
            }
        }

        /* Hiệu ứng tuyết rơi */
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 20px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Merry Christmas!</h1>
        <p>Chúc bạn một Giáng sinh vui vẻ, ấm áp và hạnh phúc!</p>
        <div class="star"></div>

    </div>
    </div>
<iframe
    id="yt-music"
    width="0"
    height="0"
    src="https://www.youtube.com/embed/cRGSR-dhTvA?autoplay=1&loop=1&playlist=cRGSR-dhTvA"
    frameborder="0"
    allow="autoplay"
    allowfullscreen>
</iframe>

    <!-- Tạo tuyết rơi bằng JS đơn giản -->
    <script>
        function createSnow() {
            const snow = document.createElement('div');
            snow.className = 'snowflake';
            snow.innerText = ['❄', '❅', '❆'][Math.floor(Math.random() * 3)];
            snow.style.left = Math.random() * 100 + 'vw';
            const size = Math.random() * 15 + 10;
            snow.style.fontSize = size + 'px';
            const duration = Math.random() * 10 + 10;
            snow.style.animationDuration = duration + 's';
            snow.style.animation = `fall ${duration}s linear infinite`;
            snow.style.opacity = Math.random() * 0.5 + 0.5;

            document.body.appendChild(snow);
            setTimeout(() => {
                snow.remove();
            }, duration * 1000);
        }
        setInterval(createSnow, 150);
        for (let i = 0; i < 100; i++) {
            setTimeout(createSnow, i * 50);
        }
    </script>
</body>

</html>
